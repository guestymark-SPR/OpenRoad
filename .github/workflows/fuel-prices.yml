name: Update fuel prices

# Every morning: the latest official average fuel prices (UK government and EU Weekly Oil Bulletin)
# published as fuel.json on the release "data", which the app's "Fill in today's prices" button reads.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet openpyxl
      - run: python3 tools/fuel_prices.py
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          gh release view data --repo "$R" > /dev/null 2>&1 || gh release create data --repo "$R" --title "OpenRoad data" --notes "Data files the app reads, such as today's fuel prices." --latest=false
          gh release upload data fuel.json --repo "$R" --clobber
