name: Check top rides with real map data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the web app in a browser and ask for top rides near real places
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
          cd web && (python3 -m http.server 8765 > /dev/null 2>&1 &) && sleep 2 && cd ..
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page()
              errs = []; pg.on('pageerror', lambda e: errs.append(str(e)))
              pg.goto('http://127.0.0.1:8765/index.html'); pg.wait_for_timeout(4000)
              for name, lng, lat in [('Buxton', -1.910, 53.259), ('Bala', -3.600, 52.911), ('Hawes', -2.197, 54.304), ('Bouillon (Ardennes)', 5.067, 49.794)]:
                  try:
                      r = pg.evaluate("async ([lng, lat]) => { const t0 = Date.now(); const l = await OR.topRides(lng, lat, 15); return [Date.now() - t0, l.map(x => x.label + (x.near ? ' near ' + x.near : '') + ' ' + (x.len/1609).toFixed(1) + 'mi twist ' + x.twist + ' ' + x.cls)] }", [lng, lat])
                      print('::notice::' + name + ' ' + str(r[0]) + ' ms: ' + ' | '.join(r[1]))
                  except Exception as e: print('::notice::' + name + ' FAILED ' + str(e)[:300])
              print('::notice::page errors ' + str(errs[:3]))
              b.close()
          PY
