name: Check the top-rides road data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the z12 map tiles around Buxton (for testing top rides)
        run: |
          python3 - <<'PY'
          import json, math, urllib.request, os
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'OpenRoad test'})).read()
          url = json.loads(get('https://tiles.openfreemap.org/planet'))['tiles'][0]
          os.makedirs('tiles', exist_ok=True)
          lat, lon, z = 53.259, -1.91, 12; n = 2 ** z
          tx = lambda lo: int((lo + 180) / 360 * n); ty = lambda la: int((1 - math.asinh(math.tan(math.radians(la))) / math.pi) / 2 * n)
          dl, dg = 15000 / 111320, 15000 / (111320 * math.cos(math.radians(lat)))
          c = 0
          for x in range(tx(lon - dg), tx(lon + dg) + 1):
              for y in range(ty(lat + dl), ty(lat - dl) + 1):
                  open(f'tiles/{z}_{x}_{y}.pbf', 'wb').write(get(url.format(z=z, x=x, y=y))); c += 1
          print('::notice::fetched', c)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiles
          path: tiles
