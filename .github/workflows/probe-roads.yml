name: Check the top-rides road data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: What road names and classes the map tiles carry near Buxton, by zoom
        run: |
          pip install -q mapbox-vector-tile
          python3 - <<'PY'
          import json, math, urllib.request, mapbox_vector_tile as mvt, collections
          tj = json.load(urllib.request.urlopen('https://tiles.openfreemap.org/planet'))
          url = tj['tiles'][0]; print('::notice::tiles', url)
          lat, lon = 53.259, -1.91
          for z in (11, 12, 13):
              n = 2 ** z; x = int((lon + 180) / 360 * n); y = int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n)
              raw = urllib.request.urlopen(urllib.request.Request(url.format(z=z, x=x, y=y), headers={'User-Agent': 'OpenRoad probe'})).read()
              t = mvt.decode(raw)
              tr = collections.Counter(f['properties'].get('class') for f in t.get('transportation', {}).get('features', []))
              tn = collections.Counter(f['properties'].get('class') for f in t.get('transportation_name', {}).get('features', []))
              refs = sorted(set((f['properties'].get('ref') or '') + '|' + (f['properties'].get('name') or '') for f in t.get('transportation_name', {}).get('features', []) if f['properties'].get('class') in ('primary','secondary','tertiary')))[:15]
              keys = sorted(set(k for f in t.get('transportation', {}).get('features', []) for k in f['properties']))
              print(f'::notice::z{z} {len(raw)} bytes | transportation {dict(tr)} keys {keys}')
              print(f'::notice::z{z} transportation_name {dict(tn)} sample {refs}')
          PY
