name: Build OpenRoad APK

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle the app, map engine and fonts
        run: bash fetch-assets.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK (GitHub version)
        shell: bash
        run: |
          set +e
          gradle assembleGithubRelease --no-daemon > build.log 2>&1
          status=$?
          # show compile errors as annotations, so they can be read without the full log
          grep -E "error:|^e: |What went wrong|Could not|AAPT|Execution failed" -A2 build.log | head -60 | sed 's/^/::error::/'
          tail -5 build.log
          exit $status

      # The old key (signing/legacy-openroad-release.jks) was published in this repo, so anyone has it.
      # Releases are signed with a new key kept in secrets; the old key only vouches for the new one
      # (a signing lineage), so phones that have OpenRoad can still update. See signing/README.md.
      - name: Sign the APK (old key rotated to the new one)
        env:
          KS_B64: ${{ secrets.OPENROAD_SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OPENROAD_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Signing secrets OPENROAD_SIGNING_KEYSTORE_B64 and OPENROAD_SIGNING_PASSWORD are not set. Nothing is published."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/new.p12"
          OLD="--ks signing/legacy-openroad-release.jks --ks-key-alias openroad --ks-pass pass:openroad --key-pass pass:openroad"
          NEW="--ks $RUNNER_TEMP/new.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --key-pass env:KS_PASS"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" --old-signer $OLD --new-signer $NEW
          mkdir -p out
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/github/release/app-github-release-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign $OLD --next-signer $NEW --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 \
            --out "out/OpenRoad-1.0.${{ github.run_number }}.apk" out/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "out/OpenRoad-1.0.${{ github.run_number }}.apk" | grep -E "Verified using|Signer|certificate SHA-256" || true
          "$BT/apksigner" verify "out/OpenRoad-1.0.${{ github.run_number }}.apk"
          cp "out/OpenRoad-1.0.${{ github.run_number }}.apk" out/OpenRoad.apk
          rm -f "$RUNNER_TEMP/new.p12" out/aligned.apk

      - name: Publish this build (download page for the phone and tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenRoad 1.0.${{ github.run_number }}
          body: |
            Open this page on your phone or tablet and tap the .apk below to install or update OpenRoad.
            ${{ github.event.head_commit.message }}
          files: android/out/OpenRoad-1.0.${{ github.run_number }}.apk

      - name: Publish to the in-app update channel (release "app")
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          N: ${{ github.run_number }}
          R: ${{ github.repository }}
        run: |
          NOTES=$(printf '%s' "${MSG:-Improvements and fixes}" | head -1 | cut -c1-300)
          jq -n --argjson v "$N" --arg n "1.0.$N" --arg notes "$NOTES" --arg apk "https://github.com/$R/releases/download/app/OpenRoad.apk" \
            '{versionCode:$v,versionName:$n,notes:$notes,apk:$apk}' > out/version.json
          gh release view app --repo "$R" > /dev/null 2>&1 || gh release create app --repo "$R" --title "OpenRoad (latest)" --notes "The latest OpenRoad app. The app checks here for updates." --latest=false
          # GitHub's API sometimes answers 500 mid-upload: try each file a few times.
          # The APK goes first, so version.json never points phones at an APK that isn't there yet.
          up() { for i in 1 2 3 4 5; do gh release upload app "$1" --repo "$R" --clobber && return 0; echo "::warning::upload of $1 failed (try $i), retrying"; sleep $((i * 10)); done; return 1; }
          up out/OpenRoad.apk
          up out/version.json
