name: Check what the map tiles carry (POIs, junction numbers)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q mapbox-vector-tile
          python3 - <<'PY'
          import json, math, urllib.request, urllib.parse, mapbox_vector_tile as mvt, collections, traceback, sys, time
          get = lambda u, d=None: urllib.request.urlopen(urllib.request.Request(u, data=d, headers={'User-Agent': 'OpenRoad/1.0 (Android motorcycle navigation; github.com/guestymark-SPR/OpenRoad)'}), timeout=90).read()
          url = json.loads(get('https://tiles.openfreemap.org/planet'))['tiles'][0]
          for place, lat, lon in [('Buxton', 53.2587, -1.9116), ('Keele services', 52.9960, -2.2930), ('Bouillon', 49.7936, 5.0670)]:
              c = collections.Counter(); minz = {}
              for z in (12, 13, 14):
                  n = 2 ** z; x0 = int((lon + 180) / 360 * n); y0 = int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n)
                  for dx in (-1, 0, 1):
                      for dy in (-1, 0, 1):
                          try: t = mvt.decode(get(url.format(z=z, x=x0+dx, y=y0+dy)))
                          except Exception as e: continue
                          for f in t.get('poi', {}).get('features', []):
                              k = f['properties'].get('class'); c[(z, k)] += 1
              print('::notice::' + place + ' ' + str({f'z{z}:{k}': v for (z, k), v in sorted(c.items(), key=lambda a: (a[0][0], -a[1])) if k in ('fuel','lodging','cafe','restaurant','fast_food','bar','beer','motorcycle','car','parking','campsite','attraction')}))
          q = '[out:json][timeout:25];node["highway"="motorway_junction"](52.8,-2.4,53.1,-2.1);out;'
          for s in ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter']:
              t0 = time.time()
              try:
                  j = json.loads(get(s, ('data=' + urllib.parse.quote(q)).encode()))
                  print(f'::notice::{s} {time.time()-t0:.1f}s junctions {len(j["elements"])} sample {[e.get("tags") for e in j["elements"][:3]]}')
              except Exception as e: print(f'::notice::{s} {time.time()-t0:.1f}s FAIL {str(e)[:120]}')
          PY
