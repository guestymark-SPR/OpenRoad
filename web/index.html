<!doctype html>
<html lang="en-GB" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OpenRoad</title>
<meta name="theme-color" content="#232b31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="top">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 21c4-3 2-7 6-9s4-6 4-9"/></svg></span>
  <input id="q" type="search" placeholder="Search places or postcodes" autocomplete="off" enterkeyhint="search" aria-label="Search places or postcodes">
  <button id="qGo" class="icon" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
  <div id="results" hidden></div>
</div>

<div id="fabs">
  <button id="locBtn" class="fab" aria-label="My position"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 2v3 M12 19v3 M2 12h3 M19 12h3"/></svg></button>
  <button id="layersBtn" class="fab" aria-label="Map style"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5z M3 13l9 5 9-5"/></svg></button>
  <button id="northBtn" class="fab" aria-label="North up"><svg viewBox="0 0 24 24"><path d="M12 3 17 20 12 16 7 20Z"/></svg></button>
</div>

<aside id="panel">
  <div id="grab" aria-label="Show or hide the panel"><span></span></div>
  <div id="views">
    <section id="v-plan" class="view on"></section>
    <section id="v-trips" class="view"></section>
    <section id="v-rides" class="view"></section>
    <section id="v-nearby" class="view"></section>
    <section id="v-more" class="view"></section>
  </div>
  <nav id="nav" aria-label="Main"></nav>
</aside>

<div id="hud" hidden>
  <div id="turn">
    <div id="turnIcon"></div>
    <div id="turnText"><div id="turnDist"></div><div id="turnStreet"></div></div>
    <div id="thenBox" hidden><span>then</span><div id="thenIcon"></div></div>
  </div>
  <div id="limit" hidden aria-label="Speed limit"></div>
  <div id="hudNote" hidden></div>
  <div id="hudBar">
    <div class="stat speed"><b id="hSpeed">0</b><i id="hSpeedU">mph</i></div>
    <div class="stat"><b id="hRemain">–</b><i id="hRemainL">to go</i></div>
    <div class="stat"><b id="hEta">–</b><i id="hEtaL">arrive</i></div>
    <div class="hudBtns">
      <button id="hMute" class="hb" aria-label="Voice on or off"></button>
      <button id="hMore" class="hb" aria-label="Ride options"><svg viewBox="0 0 24 24"><path d="M4 7h16 M4 12h16 M4 17h16"/></svg></button>
      <button id="hEnd" class="hb end">End</button>
    </div>
  </div>
  <button id="recentre" hidden>Re-centre</button>
</div>

<div id="sheet" hidden><div id="sheetBox"></div></div>
<div id="toast" role="status"></div>

<script src="vendor/maplibre-gl.js" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js';s.onload=function(){window.__mlReady&&__mlReady()};document.head.appendChild(s);var l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css';document.head.appendChild(l);window.__mlLate=1})()"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/map.js"></script>
<script src="js/route.js"></script>
<script src="js/nav.js"></script>
<script src="js/trip.js"></script>
<script src="js/ridekit.js"></script>
<script src="js/trips.js"></script>
<script src="js/offline.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-trips.js"></script>
</body>
</html>
