plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'uk.openroad.app'
    compileSdk 36

    defaultConfig {
        applicationId 'uk.openroad.app'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    buildFeatures { buildConfig true }

    // github: the APK on this repository's Releases, which updates itself and sends check-in and crash texts.
    // play: the Google Play build, without what Play doesn't allow (installing its own updates, sending texts,
    // the alarm-app-only exact alarm), targeting the Android version Play requires. Each has its own manifest.
    flavorDimensions = ['store']
    productFlavors {
        github { dimension 'store' }
        play { dimension 'store'; targetSdk 36 }
    }

    // release builds come out unsigned: the build workflow signs them with apksigner (see android/signing/README.md)
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Android Auto (Android for Cars App Library)
    implementation 'androidx.car.app:app:1.4.0'
    // QR codes: scanning a group ride's code, and drawing it
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
